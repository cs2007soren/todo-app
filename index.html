<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="utf-8">
        <title>test</title>
    </head>
    <style>
        .underline{
          text-decoration: line-through;
          color: red;  
        }
    </style>
    <body>
        <!--<button id ="delte" type="button">删除</button>-->
        <input  id="input" type="text" placeholder = "what i want to do">
        <button id ="todo" type="button">添加</button>
        <ul id="list"></ul> 
        <script>
            let todos = [];
            
            const saved = localStorage.getItem("todos");

            
            if(saved!==null){
                todos =JSON.parse(saved);
            }
            function save(){
                localStorage.setItem("todos",JSON.stringify(todos));
            }


            function render()
            {
            const list = document.getElementById("list");
            list.innerHTML = "";
            
            todos.forEach(todo =>{
                const li = document.createElement("li");
                li.textContent = todo.text;
                

                
           

                if(todo.done){
                    li.classList.add("underline");
                }list.appendChild(li);
            });                         //这一段了是对li内部元素点击会有红色线条穿过
            } 
            
                render();
        </script>
    </body>
</html>
