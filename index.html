<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="utf-8">
        <title>待办清单</title>
    </head>
    <style>
        .underline{
          text-decoration: line-through;
          color: red;  
        }
    </style>
    <body>
        <!--<button id ="delte" type="button">删除</button>-->
        <input  id="input" type="text" placeholder = "what i want to do">
        <button id ="todo" type="button">添加</button>
        <button id ="clear" type="button">删除全部</button>
        <ul id="list"></ul> 
        <script>
            let todos = [];
            
            const input = document.getElementById("input");
            const btn = document.getElementById("todo");
            btn.addEventListener("click",addToDo);
            const saved = localStorage.getItem("todos");

            const btn_clear= document.getElementById("clear");
            
            if(saved!==null){
                todos =JSON.parse(saved);
            }
            function save(){
                localStorage.setItem("todos",JSON.stringify(todos));
            }

            btn_clear.addEventListener("click",()=>{
                    todos = [];
                    save();
                    render();              //这一段是点击即删除全部元素
            })

            function render()
            {
            const list = document.getElementById("list");
            list.innerHTML = "";
            
            todos.forEach(todo =>{
                const li = document.createElement("li");
                li.textContent = todo.text;
                

                li.addEventListener("click",()=> {
                    todo.done = !todo.done
                    save()
                    render()})           //这一段实现了元素的增添
                
           
                li.addEventListener("dblclick",()=>{
                    todos = todos.filter(t=>t!==todo);
                    save();
                    render();           //这一段实现了元素的删减
                })

                if(todo.done){
                    li.classList.add("underline");
                }list.appendChild(li);
            });                         //这一段了是对li内部元素点击会有红色线条穿过
            } 
            
            function addToDo(){
                const text = input.value;
                input.value = "";
                if(text.trim()==="")return;
                todos.push({text:text,done:false});
                save();
                render();
            }
                render();
        </script>
    </body>
</html>
